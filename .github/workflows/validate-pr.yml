name: Validate UNIVERS-IA pull requests

on:
  pull_request:
    branches: [main, feature/universia-v14-c1-navigation-search, feature/universia-c2-fiches-enrichies]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Run automated tests
        run: npm test
      - name: Build GitHub Pages assets
        run: npm run build
      - name: Verify output and base path
        run: |
          test -s dist/index.html
          test -d dist/assets
          if grep -qE '(src|href)="/(src\\.js|assets/)' dist/index.html; then
            echo "Incorrect root-relative asset path" >&2
            exit 1
          fi
          grep -q '/universia/assets/' dist/index.html
      - name: Verify all GitHub Pages entry points
        run: |
          for p in bibliotheque ressources recherche outils prompts formations cas-pratiques integrite skills; do
            test -s "dist/$p/index.html"
            grep -q '/universia/assets/' "dist/$p/index.html"
          done
      - name: Install browser test driver
        run: npm install --no-save --no-package-lock playwright-core
      - name: Browser smoke test (GitHub Pages-style build)
        run: |
          npm run preview -- --host 127.0.0.1 --port 4174 > /tmp/universia-github-preview.log 2>&1 &
          for i in {1..30}; do
            curl -fsS http://127.0.0.1:4174/universia/ >/dev/null && break
            sleep 1
          done
          UI_URL=http://127.0.0.1:4174/universia/ CHROME_BIN=$(command -v google-chrome) node scripts/ui-smoke.mjs
      - name: Build Vercel Preview assets
        run: VERCEL=1 npm run build
      - name: Verify Vercel root paths
        run: |
          test -s dist/index.html
          test -d dist/assets
          grep -qE '(src|href)="/assets/' dist/index.html
          if grep -q '/universia/assets/' dist/index.html; then
            echo "Unexpected GitHub Pages path in Vercel build" >&2
            exit 1
          fi
      - name: Verify all Vercel entry points
        run: |
          for p in bibliotheque ressources recherche outils prompts formations cas-pratiques integrite skills; do
            test -s "dist/$p/index.html"
            grep -q '/assets/' "dist/$p/index.html"
          done
      - name: Browser smoke test (Vercel-style build)
        run: |
          VERCEL=1 npm run preview -- --host 127.0.0.1 --port 4173 > /tmp/universia-preview.log 2>&1 &
          for i in {1..30}; do
            curl -fsS http://127.0.0.1:4173/ >/dev/null && break
            sleep 1
          done
          CHROME_BIN=$(command -v google-chrome) node scripts/ui-smoke.mjs
      - name: Upload browser screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: universia-browser-screenshots
          path: screenshots/
          if-no-files-found: ignore
